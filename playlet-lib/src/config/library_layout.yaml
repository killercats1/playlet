# Rows of the Library tab in the side bar.
- title: Continue watching
  id: continue_watching
  feedSources:
    - id: inv_auth_continue_watching
      title: Continue watching
      apiType: Invidious
      endpoint: auth_continue_watching

- title: Watch history
  id: watch_history
  feedSources:
    - id: inv_auth_history
      title: Watch history
      apiType: Invidious
      endpoint: watch_history

- title: Liked videos
  id: liked_videos
  feedSources:
    - id: inv_auth_liked_videos
      title: Liked videos
      apiType: Invidious
      endpoint: auth_playlist_videos
      pathParams:
        plid: LL

- title: Watch later
  id: watch_later
  feedSources:
    - id: inv_auth_watch_later
      title: Watch later
      apiType: Invidious
      endpoint: auth_playlist_videos
      pathParams:
        plid: WL

- title: Playlists
  id: playlists
  feedSources:
    - id: inv_auth_playlists
      title: Playlists
      apiType: Invidious
      endpoint: auth_playlists
