- title: Subscriptions
  id: subscriptions
  feedSources:
    - id: inv_auth_feed
      title: Subscriptions
      apiType: Invidious
      endpoint: auth_feed

- title: Recommended
  id: recommended
  feedSources:
    - id: inv_auth_recommended
      title: Recommended
      apiType: Invidious
      endpoint: auth_recommended

# Videos started but not finished (signed in with YouTube); the row goes away when there are none.
- title: Continue watching
  id: continue_watching
  feedSources:
    - id: inv_auth_continue_watching
      title: Continue watching
      apiType: Invidious
      endpoint: auth_continue_watching

# YouTube's own home shelves after Recommended, one row each with YouTube's title. "expandRows" turns this entry
# into that many rows (index 1, 2, ...); rows without a shelf go away.
- title: More for you
  id: home_shelves
  expandRows: 6
  feedSources:
    - id: inv_auth_home_shelf
      title: More for you
      apiType: Invidious
      endpoint: auth_home_shelf
      useResponseTitle: true

# The account's Shorts (signed in with YouTube); hidden with the "Disable Shorts" setting.
- title: Shorts
  id: shorts
  feedSources:
    - id: inv_auth_shorts
      title: Shorts
      apiType: Invidious
      endpoint: auth_shorts
      queryParams:
        respectDisableShorts: true

- title: Trending - Live
  id: trending_livestreams
  feedSources:
    - id: inv_trending_livestreams
      title: Trending - Live
      apiType: Invidious
      endpoint: trending
      queryParams:
        type: Livestreams

- title: Trending - Gaming
  id: trending_gaming
  feedSources:
    - id: inv_trending_gaming
      title: Trending - Gaming
      apiType: Invidious
      endpoint: trending
      queryParams:
        type: Gaming

- title: Popular
  id: popular
  feedSources:
    - id: inv_popular
      title: Popular
      apiType: Invidious
      endpoint: popular

- title: Playlists
  id: playlists
  feedSources:
    - id: inv_auth_playlists
      title: Playlists
      apiType: Invidious
      endpoint: auth_playlists

- title: Watch history
  id: watch_history
  feedSources:
    - id: inv_auth_history
      title: Watch history
      apiType: Invidious
      endpoint: watch_history
