# Rows of the Music tab in the side bar: the account's YouTube Music recommendations (when signed in with
# YouTube, and if YouTube Music accepts the sign-in), then YouTube's own Music channel.
- title: Recommended music
  id: recommended_music
  feedSources:
    - id: music_recommended
      title: Recommended music
      apiType: Invidious
      endpoint: auth_music_recommended

- title: Trending - Music
  id: trending_music
  feedSources:
    - id: inv_trending_music
      title: Trending - Music
      apiType: Invidious
      endpoint: trending
      queryParams:
        type: Music

- title: Music
  id: music_featured
  feedSources:
    - id: music_channel_featured
      title: Music
      apiType: Invidious
      endpoint: channel_featured
      pathParams:
        ucid: UC-9-kyTW8ZkZNDHQJ6FgpwQ

- title: Music playlists
  id: music_playlists
  feedSources:
    - id: music_channel_playlists
      title: Music playlists
      apiType: Invidious
      endpoint: channel_playlists
      pathParams:
        ucid: UC-9-kyTW8ZkZNDHQJ6FgpwQ
