# Rows of the Music tab in the side bar, like YouTube's Music page: the shelves of the account's TV Music page
# (Mixed for you, New releases, ... with YouTube's titles; "expandRows" makes one row per shelf, rows without a
# shelf go away), then YouTube's own Music channel. Without a YouTube sign-in only the channel rows show.
- title: Music for you
  id: music_shelves
  expandRows: 8
  feedSources:
    - id: inv_auth_topic_shelf_music
      title: Music for you
      apiType: Invidious
      endpoint: auth_topic_shelf
      useResponseTitle: true
      queryParams:
        topic: music

# The account's YouTube Music recommendations, when the shelves above aren't available (removed otherwise empty).
- title: Recommended music
  id: recommended_music
  feedSources:
    - id: music_recommended
      title: Recommended music
      apiType: Invidious
      endpoint: auth_music_recommended

- title: Trending - Music
  id: trending_music
  feedSources:
    - id: inv_trending_music
      title: Trending - Music
      apiType: Invidious
      endpoint: trending
      queryParams:
        type: Music

- title: Music
  id: music_featured
  feedSources:
    - id: music_channel_featured
      title: Music
      apiType: Invidious
      endpoint: channel_featured
      pathParams:
        ucid: UC-9-kyTW8ZkZNDHQJ6FgpwQ

- title: Music playlists
  id: music_playlists
  feedSources:
    - id: music_channel_playlists
      title: Music playlists
      apiType: Invidious
      endpoint: channel_playlists
      pathParams:
        ucid: UC-9-kyTW8ZkZNDHQJ6FgpwQ
